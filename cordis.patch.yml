# dsh-a2a bundle patch
#
# 通过官方 CLI 安装时——
#
#   dsh plugin --profile <name> add @zyfgood/dsh-a2a        # npm 渠道（推荐）
#   dsh plugin --profile <name> add github:zyfgood/dsh-a2a  # 或 GitHub
#
# ——CLI 会把本包加入 profile 的 bundle 栈；profile 启动时合并此 patch
#（单行 insert 插件行），无需手工编辑 cordis.yml。
# lib/ 预构建产物随仓库发布，安装即用，无需构建脚本。
#
# 启动后 DSH agent 即作为 A2A 服务器暴露在本机（默认 127.0.0.1:7310）：
#   Agent Card:  http://127.0.0.1:7310/.well-known/agent-card.json
#   JSON-RPC:    POST http://127.0.0.1:7310/
# 更多配置（bearerToken / llm 模式 / 公网 URL 等）见 README。
- insert:
    - id: a2a
      name: '@zyfgood/dsh-a2a'
      config:
        port: 7310
        mode: agent
